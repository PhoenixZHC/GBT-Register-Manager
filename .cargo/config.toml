# 本文件不再覆盖 `crates-io`：Cargo 自带的 `crates-io` 已使用官方 sparse 索引，
# 若再写 `replace-with` + `registry = "sparse+https://index.crates.io/"` 会与内置源重名报错。
#
# 若曾遇 rsproxy + 127.0.0.1:7890 代理失败，请检查用户级 `~/.cargo/config.toml` 是否仍把
# `crates-io` 指到 rsproxy；需要国内镜像时，可仅在「用户配置」或本文件末尾自行添加
# （且勿与下面已删除的重复 sparse 写法并存）：
#
# [source.crates-io]
# replace-with = "rsproxy-sparse"
# [source.rsproxy-sparse]
# registry = "sparse+https://rsproxy.cn/index/"

[net]
retry = 5

# 静态链接 MSVC C++ 运行时（msvcp140.dll / vcruntime140.dll）。
# 效果：安装包不再依赖客户电脑上的 Visual C++ Redistributable，
#       彻底消除"缺少 DLL"导致白屏或闪退的问题。
# 代价：可执行文件体积增大约 200-400 KB，可忽略不计。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
