[package]
name = "gbt-register-manager"
version = "1.2.8"
description = "Agilebot robot toolbox"
authors = ["Agilebot"]
edition = "2021"

[lib]
name = "gbt_register_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10", default-features = false, features = ["wry"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
ssh2 = "0.9"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
chrono = "0.4"
tempfile = "3"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
anyhow = "1"
url = "2"

[features]
default = []
devtools = ["tauri/devtools"]

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true
