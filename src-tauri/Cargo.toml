[package]
name = "gbt-register-manager"
version = "1.1.1"
description = "Agilebot robot toolbox — 捷勃特机器人工具箱"
authors = ["Agilebot"]
edition = "2021"

[lib]
name = "gbt_register_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10", features = ["devtools"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# 勿启用 vendored-openssl（需 Perl 从源码编 OpenSSL）。Windows MSVC 走 WinCNG。
ssh2 = "0.9"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
chrono = "0.4"
tempfile = "3"
walkdir = "2"

[profile.release]
# 缩小安装包体积并启用 LTO，代价是编译时间。
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
